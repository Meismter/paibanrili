# Build IPA · v3-fingerprint 2026-08-25
# 自动发现工程文件，确保运行的是最新版本
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: "[FINGERPRINT_V3] Checkout"
        uses: actions/checkout@v4

      - name: "[FINGERPRINT_V3] 显式切到工作目录"
        run: |
          echo "FINGERPRINT_V3_RUNNING"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -la

      - name: "[FINGERPRINT_V3] Install XcodeGen"
        run: brew install xcodegen

      - name: "[FINGERPRINT_V3] Generate Xcode project"
        run: |
          cd "$GITHUB_WORKSPACE"
          xcodegen generate
          echo "---- 生成后目录 ----"
          ls -la
          echo "---- 找所有 xcodeproj ----"
          find . -name "*.xcodeproj" -not -path "*/build/*" 2>/dev/null

      - name: "[FINGERPRINT_V3] Build app (auto-detect project)"
        # 不写死工程名，自动从 .xcodeproj 文件推断
        run: |
          cd "$GITHUB_WORKSPACE"
          PROJECT_PATH=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: 找不到任何 .xcodeproj 文件"
            find . -name "*.xcodeproj" -not -path "*/build/*"
            exit 1
          fi
          echo "使用工程: $PROJECT_PATH"
          SCHEME_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          # 优先用 ShiftScheduler 作为 scheme（target 名）
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme ShiftScheduler \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build_output.log

      - name: "[FINGERPRINT_V3] Save error log to repo (on failure)"
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          grep -E "error:|warning: .*deprecated|BUILD FAILED|note: Building" build_output.log | head -120 > build_errors.txt || true
          echo "== 构建失败 $(date -u +%FT%TZ) ==" >> build_errors.txt
          tail -60 build_output.log >> build_errors.txt || true
          git config user.name "build-bot"
          git config user.email "actions@github.com"
          git add build_errors.txt
          git commit -m "ci: 上传构建错误日志 [skip ci]" || echo "nothing to commit"
          git push origin HEAD:build-errors || echo "push failed"

      - name: "[FINGERPRINT_V3] Package unsigned IPA"
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          mkdir -p Payload
          cp -R ShiftScheduler.app Payload/
          zip -r ShiftScheduler-unsigned.ipa Payload
          ls -lh ShiftScheduler-unsigned.ipa

      - name: "[FINGERPRINT_V3] Upload IPA artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ShiftScheduler-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/ShiftScheduler-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: "[FINGERPRINT_V3] Publish IPA to GitHub Packages"
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          PKG_DIR="$GITHUB_WORKSPACE/ipa-package"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"
          cp ShiftScheduler-unsigned.ipa "$PKG_DIR/"
          cd "$PKG_DIR"
          VERSION="1.3.${GITHUB_RUN_NUMBER}"
          cat > package.json <<EOF
          {
            "name": "@meismter/shift-scheduler-ipa",
            "version": "${VERSION}",
            "description": "排班助手 ShiftScheduler iOS IPA (unsigned) - commit ${GITHUB_SHA:0:7}",
            "license": "UNLICENSED",
            "files": ["*.ipa"],
            "publishConfig": { "registry": "https://npm.pkg.github.com/" }
          }
          EOF
          # 用 printf 写 .npmrc（避免 heredoc 缩进污染）+ NODE_AUTH_TOKEN 双保险
          printf '@meismter:registry=https://npm.pkg.github.com/\n' > .npmrc
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" >> .npmrc
          echo "GITH_TOKEN_LEN=${#GITHUB_TOKEN} NODE_AUTH_TOKEN_LEN=${#NODE_AUTH_TOKEN}"
          echo "--- .npmrc (token 已遮蔽) ---"
          sed 's#\(_authToken=\).*#\1***#' .npmrc
          npm publish --tag latest
          echo "OK: @meismter/shift-scheduler-ipa@${VERSION}"
